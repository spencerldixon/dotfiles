LSEP=
RSEP=

set -g default-terminal "tmux-256color"
# Ghostty uses xterm-ghostty; retain compatibility with xterm-256color terminals.
set -as terminal-features ",xterm-ghostty:RGB:hyperlinks:clipboard"
set -as terminal-features ",xterm-256color:RGB:hyperlinks"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vim-style selection with copying to the macOS clipboard.
setw -g mode-keys vi
set -s set-clipboard external
set -s copy-command 'pbcopy'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# Keybinding
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c '#{pane_current_path}'  # Split panes horizontal
bind - split-window -v -c '#{pane_current_path}'  # Split panes vertically
bind p display-popup -E -w 80% -h 80% -d '#{pane_current_path}'

set -g status-style 'fg=#a9b1d6,bg=#1a1b26'

unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -g status-justify left

# default statusbar colors
set -g status-left '#[fg=#7aa2f7,bg=#1a1b26,bold] #S  #[default]'
set -g status-left-length 50

## Keep the status bar at the bottom.
set-option -g status-position bottom

## Tmux Windows (left) - inactive, active pane - #I: Number, #W: Name
set -g window-status-format '#[fg=#565f89,bg=#1a1b26] #I #W '
set -g window-status-current-format '#[fg=#1a1b26,bg=#7aa2f7,bold] #I #W #[default]'

## Remove gap between window statuses
set-window-option -g window-status-separator ' '

## highlight activity in status bar
# setw -g window-status-activity-style fg="colour10",bg="colour05",bold

# set highlight bar in session selection
set-window-option -g mode-style 'fg=#1a1b26,bg=#7aa2f7,bold'

# border colours
set -g pane-border-style 'fg=#414868,bg=default'
set -g pane-active-border-style 'fg=#7aa2f7,bg=default'

# Active pane background
set -g window-style 'fg=default,bg=default'
set -g window-active-style 'fg=default,bg=default'

# move to panes with hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded config"

set -g status-interval 5 # Update the statusline every 5 seconds
set -g status-right '#(sh ~/.tmux/powerline.sh) | #{battery_percentage} #{battery_icon_status} '
set -g status-right-length 150

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-battery'
# Keep Continuum last so its autosave hook survives status-bar plugins.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Tmux battery icons
set -g @batt_charged_icon "✔︎"
set -g @batt_charging_icon "⚡︎"
set -g @batt_discharging_icon "♥︎"
set -g @batt_attached_icon "!"

set -g @resurrect-strategy-vim 'session'

run '~/.tmux/plugins/tpm/tpm'

set -g mouse on


# Let apps talk to the terminal directly (kitty graphics protocol, etc.)
set -g allow-passthrough on
